name: Self-test Mini-App

# سلف‌تست سرتاسری مینی‌اپ تلگرام در jsdom.
# هیچ سری/توکنی لازم ندارد و روی ربات زنده (bot.yml) اثری نمی‌گذارد.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/**'
      - '.github/workflows/selftest-app.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: selftest-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: «مینی‌اپ بدون خطا اجرا می‌شود»
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب jsdom
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: سلف‌تست استاتیک (بدون مرورگر)
        working-directory: docs
        run: node selftest_docs.mjs

      - name: سلف‌تست سرتاسری مینی‌اپ (jsdom)
        working-directory: tests
        run: node e2e_app.mjs
