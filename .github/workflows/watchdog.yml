name: Bot Watchdog

# اگر ربات ۲۴/۷ به هر دلیلی خاموش شد (تایم‌اوت جاب، لغو دستی، قفل‌شدن صف
# concurrency)، این نگهبان حداکثر ۱۵ دقیقه بعد دوباره روشنش می‌کند.
# دقیقاً همان اتفاقی که باعث شد ربات چند ساعت پایین بماند.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: bot-watchdog
  cancel-in-progress: false

jobs:
  ensure-bot:
    name: 🩺 بررسی زنده‌بودن ربات
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: روشن‌کردن ربات در صورت خاموشی
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({
              owner, repo,
              workflow_id: "bot.yml",
              per_page: 10,
            });
            const live = runs.data.workflow_runs.find((r) =>
              r.status === "in_progress" || r.status === "queued" || r.status === "waiting"
            );
            if (live) {
              core.info(`✅ ربات زنده/در صف است: run ${live.id} (${live.status})`);
              return;
            }
            const last = runs.data.workflow_runs[0];
            core.warning(`⚠️ هیچ اجرای فعالی نیست (آخرین: ${last ? last.id + " → " + last.conclusion : "هیچ"}). ربات را روشن می‌کنم.`);
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: "bot.yml", ref: "main",
            });
            core.notice("🚀 درخواست اجرای ربات ثبت شد.");
