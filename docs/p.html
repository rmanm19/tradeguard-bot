<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070c16" />
<title>TradeGuard — معرفی شریک</title>
<meta name="description" content="صفحهٔ معرفی شریک TradeGuard؛ با کد اختصاصی همین لینک ثبت‌نام کنید و ورودتان در ربات شمرده می‌شود." />
<meta name="robots" content="noindex, follow" />
<meta property="og:type" content="website" />
<meta property="og:title" content="TradeGuard — معرفی شریک" />
<meta property="og:description" content="با کد اختصاصی همین لینک ثبت‌نام کنید؛ ورودتان در ربات TradeGuard شمرده می‌شود." />
<!--
  صفحهٔ فرود اختصاصی هر شریک (affiliate landing)
  ------------------------------------------------------------------
  آدرس: p.html?id=<partner-id>      مثال: p.html?id=propfirm_x
  منبع دادهٔ کارت: partners.json (همان منبع مینی‌اپ؛ هر تغییر آنجا اینجا هم دیده می‌شود)
  لینک واقعی رهگیری: https://t.me/<bot>?start=p_<id>  → در ربات ثبت و شمرده می‌شود
  صفحه کاملاً ایستا است؛ هیچ داده‌ای از کاربر نمی‌گیرد و خودش را دروغ نمی‌کند:
  اگر شریکی با این شناسه وجود نداشته باشد، پیام «لینک معتبر نیست» جای کارت می‌نشیند.
-->
<style>
  :root{
    --bg:#070c16; --bg2:#0b1a20; --card:#0f1626; --line:rgba(120,200,180,.16);
    --mint:#38e0b2; --mint-soft:#8ff0d2; --txt:#eef8f5; --dim:#9db3b3; --warn:#ffc46b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 520px at 82% -8%, rgba(30,140,120,.30), transparent 60%),
      linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%);
    color:var(--txt); min-height:100vh;
    font-family:Vazirmatn,"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;
    line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  body[dir="ltr"]{font-family:Vazirmatn,"Segoe UI",Roboto,system-ui,sans-serif}
  .wrap{max-width:640px;margin:0 auto;padding:22px 18px 56px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(145deg,#0e2b2a,#0a1524);border:1px solid var(--line);color:var(--mint)}
  .brand b{display:block;font-size:17px;letter-spacing:-.2px}
  .brand small{color:var(--dim);font-size:12px}
  .lang{margin-inline-start:auto;background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:6px 13px;font:inherit;font-size:12px;cursor:pointer}
  .lang:hover{color:var(--txt);border-color:rgba(120,200,180,.4)}
  .card{background:linear-gradient(180deg,rgba(20,32,50,.92),rgba(14,22,38,.92));
    border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 24px 60px -30px #000}
  .phead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .avatar{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:28px;
    background:radial-gradient(circle at 30% 25%,#123a35,#0a1626);border:1px solid var(--line);flex:0 0 auto}
  .pname{font-size:21px;font-weight:800;margin:0;letter-spacing:-.3px}
  .pnote{color:var(--dim);font-size:14px;margin:2px 0 0}
  .badge{display:inline-block;margin-inline-start:auto;align-self:flex-start;font-size:11px;color:#06231d;
    background:var(--mint);border-radius:999px;padding:4px 10px;font-weight:800;white-space:nowrap}
  .perks{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:9px}
  .perks li{display:flex;gap:9px;font-size:14.5px;color:#d7e7e4}
  .perks li::before{content:"✓";color:var(--mint);font-weight:900;flex:0 0 auto}
  .cta{display:block;text-align:center;margin-top:20px;background:var(--mint);color:#06231d;
    font-weight:900;font-size:16.5px;text-decoration:none;border-radius:14px;padding:15px 18px;
    box-shadow:0 12px 30px -14px rgba(56,224,178,.85)}
  .cta:active{transform:translateY(1px)}
  .sub{display:block;text-align:center;color:var(--dim);font-size:12.5px;margin-top:10px}
  .code{margin-top:18px;border:1px dashed rgba(120,200,180,.28);border-radius:14px;padding:12px 14px;
    font-size:13px;color:#cfe6e1;background:rgba(9,20,24,.6);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .code code{background:#08131c;border:1px solid var(--line);border-radius:8px;padding:2px 8px;
    color:var(--mint-soft);font-size:12.5px;direction:ltr}
  .note{margin-top:16px;font-size:12.5px;color:var(--warn);background:rgba(255,196,107,.07);
    border:1px solid rgba(255,196,107,.22);border-radius:12px;padding:10px 13px}
  h2{font-size:15px;margin:30px 0 12px;color:#cfe6e1;font-weight:800}
  .why{display:grid;gap:10px}
  .why div{display:flex;gap:10px;font-size:14px;color:#c5d8d5}
  .why span{color:var(--mint)}
  .fallback{text-align:center;padding:14px 4px 6px}
  .fallback .big{font-size:44px;margin-bottom:6px}
  .fallback h1{font-size:19px;margin:0 0 8px}
  .fallback p{color:var(--dim);font-size:14px;margin:0 0 18px}
  footer{margin-top:30px;text-align:center;color:#6d8383;font-size:12px}
  footer a{color:var(--mint-soft);text-decoration:none}
  .skeleton{height:190px;border-radius:22px;border:1px solid var(--line);
    background:linear-gradient(100deg,#0d1523 30%,#122033 50%,#0d1523 70%);background-size:220% 100%;
    animation:sh 1.1s linear infinite}
  @keyframes sh{to{background-position:-120% 0}}
  @media (max-width:420px){.pname{font-size:19px}.wrap{padding:18px 14px 44px}}
  @media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.2-2.9 7.6-7 9-4.1-1.4-7-4.8-7-9V6l7-3z"/><path d="M8.7 12.2l2.2 2.2 4.4-4.4"/></svg>
    </span>
    <span class="brand"><b>TradeGuard</b><small id="brandTag">رادار ریسک بازار</small></span>
    <button class="lang" id="langBtn" type="button">EN</button>
  </header>

  <main id="main"><div class="skeleton" id="skel" aria-hidden="true"></div></main>

  <h2 id="whyTitle">چرا TradeGuard؟</h2>
  <div class="why" id="why"></div>

  <footer>
    <span id="footNote">صفحهٔ معرفی شریک — بدون جمع‌آوری اطلاعات شخصی.</span><br />
    <a id="chanLink" href="https://t.me/tradeguard1">t.me/tradeguard1</a> ·
    <a href="business.html">برای بروکرها</a> ·
    <a href="api/index.html">API</a>
  </footer>
</div>

<script>
(function () {
  "use strict";
  var BOT = "TradeGuard1_bot";
  var CHANNEL = "https://t.me/tradeguard1";
  var params = new URLSearchParams(location.search);
  // پیش‌فرض فارسی است (مخاطب اصلی کانال فارسی‌زبان است)؛ انگلیسی فقط با ?lang=en
  var lang = (params.get("lang") || "").toLowerCase().indexOf("en") === 0 ? "en" : "fa";
  var pid = (params.get("id") || params.get("p") || "").trim().toLowerCase();
  var T = {
    fa: {
      title: "معرفی شریک", brandTag: "رادار ریسک بازار", cta: "ثبت‌نام با کد اختصاصی این لینک",
      sub: "کد رهگیری شما در ربات ثبت می‌شود؛ هیچ هزینهٔ اضافه‌ای بابت این لینک نمی‌دهید.",
      codeLabel: "کد رهگیری این لینک:", codeHint: "کد معرف شریک:", whyTitle: "چرا TradeGuard؟",
      why: ["رادار زندهٔ فاندینگ، آپن‌اینترست و ترس‌وطمع — هر ۳ ساعت در تلگرام",
            "محاسبهٔ حجم، اسکن چارت و چک‌لیست پراپ‌فرم؛ بدون نصب هیچ افزونه‌ای",
            "۶ زبان، خروجی MT5 و Pine، و هیچ وعدهٔ سود تضمینی"],
      disc: "این لینک همکاری است؛ اگر از آن ثبت‌نام کنید ممکن است کمیسیون بگیریم — بدون هزینهٔ اضافه برای شما.",
      badTitle: "این لینک معتبر نیست",
      badBody: "شناسهٔ شریک پیدا نشد. اگر این صفحه را دستی باز کرده‌اید، لطفاً از لینک رسمی کانال استفاده کنید.",
      badCta: "رفتن به ربات", foot: "صفحهٔ معرفی شریک — بدون جمع‌آوری اطلاعات شخصی.",
      notReady: "اطلاعات این شریک هنوز منتشر نشده است.",
      goBot: "باز کردن ربات", goChan: "کانال تلگرام"
    },
    en: {
      title: "Partner page", brandTag: "Market risk radar", cta: "Sign up with this link's dedicated code",
      sub: "Your tracking code is recorded in the bot; this link costs you nothing extra.",
      codeLabel: "Tracking code:", codeHint: "Referral code:", whyTitle: "Why TradeGuard?",
      why: ["Live funding, open-interest and fear & greed radar — every 3 hours on Telegram",
            "Position sizing, chart scan and prop-firm checklist; nothing to install",
            "6 languages, MT5 and Pine exports, and no guaranteed-profit promises"],
      disc: "This is an affiliate link; we may earn a commission if you sign up — at no extra cost to you.",
      badTitle: "This link is not valid",
      badBody: "No partner matched this ID. If you opened this page manually, please use the official channel link.",
      badCta: "Open the bot", foot: "Partner page — no personal data is collected.",
      notReady: "This partner's details have not been published yet.",
      goBot: "Open the bot", goChan: "Telegram channel"
    }
  };
  var t = T[lang];

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";

  var $ = function (id) { return document.getElementById(id); };
  var botLink = "https://t.me/" + BOT + (pid ? "?start=p_" + encodeURIComponent(pid) : "");
  var main = $("main");

  $("brandTag").textContent = t.brandTag;
  $("whyTitle").textContent = t.whyTitle;
  $("footNote").textContent = t.foot;
  $("chanLink").href = CHANNEL;
  $("langBtn").textContent = lang === "fa" ? "EN" : "فا";
  $("langBtn").addEventListener("click", function () {
    var u = new URL(location.href);
    u.searchParams.set("lang", lang === "fa" ? "en" : "fa");
    location.href = u.toString();
  });
  $("why").innerHTML = t.why.map(function (x) { return "<div><span>◆</span><p style='margin:0'>" + esc(x) + "</p></div>"; }).join("");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showFallback(msg) {
    main.innerHTML =
      '<div class="card fallback"><div class="big">🔗</div>' +
      "<h1>" + esc(t.badTitle) + "</h1><p>" + esc(msg || t.badBody) + "</p>" +
      '<a class="cta" href="' + esc(botLink) + '">' + esc(t.badCta) + "</a>" +
      '<a class="sub" href="' + CHANNEL + '">' + esc(t.goChan) + "</a></div>";
    document.title = "TradeGuard — " + t.badTitle;
  }

  function render(p, disclosure) {
    var name = p.name || p.id;
    document.title = "TradeGuard — " + name;
    var desc = document.querySelector('meta[name="description"]');
    if (desc) desc.setAttribute("content", String(p.note || name));
    var perks = Array.isArray(p.perks) ? p.perks.filter(function (x) { return typeof x === "string" && x.trim(); }) : [];
    var html =
      '<div class="card">' +
        '<div class="phead">' +
          '<div class="avatar">' + esc(p.emoji || "🤝") + "</div>" +
          "<div><h1 class='pname'>" + esc(name) + "</h1>" +
          (p.note ? "<p class='pnote'>" + esc(p.note) + "</p>" : "") + "</div>" +
          (p.badge ? "<span class='badge'>" + esc(p.badge) + "</span>" : "") +
        "</div>" +
        (perks.length ? "<ul class='perks'>" + perks.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "") +
        '<a class="cta" rel="sponsored nofollow noopener" href="' + esc(botLink) + '">' + esc(t.cta) + "</a>" +
        '<span class="sub">' + esc(t.sub) + "</span>" +
        '<div class="code"><span>' + esc(t.codeLabel) + "</span><code>p_" + esc(p.id) + "</code>" +
          (p.code ? "<span>" + esc(t.codeHint) + " <code>" + esc(p.code) + "</code></span>" : "") +
        "</div>" +
        '<div class="note">' + esc(p.disclosure || disclosure || t.disc) + "</div>" +
      "</div>";
    main.innerHTML = html;
    var cta = main.querySelector(".cta");
    if (cta) cta.addEventListener("click", function () {
      try {
        if (window.Telegram && Telegram.WebApp && Telegram.WebApp.openTelegramLink) {
          Telegram.WebApp.openTelegramLink(botLink);
          return false;
        }
      } catch (e) {}
    });
  }

  if (!pid) { showFallback(t.badBody); return; }

  fetch("partners.json", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (data) {
      var list = (data && Array.isArray(data.partners)) ? data.partners : [];
      var hit = list.filter(function (p) {
        var id = String(p && (p.id || p.slug) || "").trim().toLowerCase();
        return id && id === pid && /^https?:\/\//.test(String(p.url || ""));
      })[0];
      if (!hit) { showFallback(pid && !list.length ? t.notReady : t.badBody); return; }
      render(hit, data.disclosure);
    })
    .catch(function () { showFallback(t.badBody); });
})();
</script>
<noscript><p style="text-align:center;color:#9db3b3">برای دیدن این صفحه جاوااسکریپت لازم است. / JavaScript is required.</p></noscript>
</body>
</html>
